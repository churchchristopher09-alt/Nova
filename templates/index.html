<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova-AI Powerhouse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
        }
        .console-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }
        .title-header {
            color: #58a6ff;
            text-align: center;
            font-weight: 700;
        }
        .subtitle {
            color: #8b949e;
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .badge-status {
            background-color: #238636;
            color: #fff;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        .metric-box {
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
        }
        .metric-value {
            color: #f0f6fc;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .metric-label {
            color: #8b949e;
            font-size: 0.75rem;
            text-transform: uppercase;
        }
        .console-output {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            height: 320px;
            overflow-y: auto;
            padding: 15px;
            margin-top: 15px;
            margin-bottom: 15px;
        }
        .msg-user {
            color: #58a6ff;
            margin-bottom: 8px;
        }
        .msg-ai {
            color: #3fb950;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="console-card">
    <div class="text-center mb-2">
        <span class="badge-status">AI PREDICTIVE CORE ACTIVE</span>
    </div>
    <h3 class="title-header">Nova-AI Powerhouse</h3>
    <p class="subtitle">SUPER INTELLIGENCE CORE MUNICIPAL ALLOCATION ENGINE</p>

    <!-- State Selection Header Control -->
    <div class="row g-2 mb-3 align-items-center">
        <div class="col-sm-4 text-sm-start text-center">
            <label for="stateSelector" class="form-label mb-0 text-muted small">Select Jurisdiction:</label>
        </div>
        <div class="col-sm-8">
            <select id="stateSelector" class="form-select form-select-sm bg-dark text-light border-secondary">
                <option value="North Carolina">North Carolina (Rocky Mount / Nash)</option>
                <option value="California">California</option>
                <option value="New York">New York</option>
                <option value="Texas">Texas</option>
                <option value="Florida">Florida</option>
                <option value="National">All 50 States (National Summary)</option>
            </select>
        </div>
    </div>

    <!-- Telemetry Cards -->
    <div class="row g-2">
        <div class="col-4">
            <div class="metric-box">
                <div class="metric-label">Housing Available</div>
                <div class="metric-value">1,248</div>
            </div>
        </div>
        <div class="col-4">
            <div class="metric-box">
                <div class="metric-label">Taxpayer Savings</div>
                <div class="metric-value">$350M+</div>
            </div>
        </div>
        <div class="col-4">
            <div class="metric-box">
                <div class="metric-label">Efficiency Rate</div>
                <div class="metric-value">99.4%</div>
            </div>
        </div>
    </div>

    <!-- Console Terminal -->
    <div class="console-output" id="consoleOutput">
        <div class="msg-ai"><strong>Nova-AI Core:</strong> Intelligence system active. Select a jurisdiction or ask any question regarding municipal telemetry.</div>
    </div>

    <!-- Query Input Bar -->
    <div class="input-group">
        <input type="text" id="queryInput" class="form-control bg-dark text-light border-secondary" placeholder="Ask any question in plain English...">
        <button class="btn btn-primary" id="executeBtn" onclick="sendQuery()">Execute</button>
    </div>
</div>

<script>
    async function sendQuery(customPrompt = null) {
        const inputField = document.getElementById('queryInput');
        const outputDiv = document.getElementById('consoleOutput');
        const stateSelector = document.getElementById('stateSelector');
        
        let promptText = customPrompt || inputField.value.trim();
        if (!promptText) return;

        const selectedState = stateSelector.value;
        const fullPrompt = `${selectedState}: ${promptText}`;

        // Append User Question
        outputDiv.innerHTML += `<div class="msg-user"><strong>User [${selectedState}]:</strong> ${promptText}</div>`;
        if (!customPrompt) inputField.value = '';
        outputDiv.scrollTop = outputDiv.scrollHeight;

        try {
            const res = await fetch('/api/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: fullPrompt })
            });
            const data = await res.json();

            // Append AI Response
            outputDiv.innerHTML += `<div class="msg-ai"><strong>Nova-AI Core:</strong> ${data.response}</div>`;
            outputDiv.scrollTop = outputDiv.scrollHeight;

            // Trigger Web Speech API audio if supported
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(data.response);
                window.speechSynthesis.speak(utterance);
            }
        } catch (err) {
            outputDiv.innerHTML += `<div class="msg-ai text-danger"><strong>System Error:</strong> Unable to connect to server.</div>`;
        }
    }

    document.getElementById('queryInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendQuery();
        }
    });
</script>

</body>
</html>
