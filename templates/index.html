    <script>
        // Voice synthesis configuration
        function speakText(text) {
            if ('speechSynthesis' in window) {
                // Stop any current speech
                window.speechSynthesis.cancel();

                // Clean up Markdown symbols (*, #, $, etc.) so the voice reads cleanly
                const cleanText = text.replace(/[*#$`\\_]/g, '');

                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.rate = 0.95; // Clear, authoritative pacing
                utterance.pitch = 1.0;

                // Select a preferred clear English voice if available
                const voices = window.speechSynthesis.getVoices();
                const preferredVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Female')));
                if (preferredVoice) {
                    utterance.voice = preferredVoice;
                }

                window.speechSynthesis.speak(utterance);
            }
        }

        async function sendQuery() {
            const input = document.getElementById("queryInput");
            const consoleBox = document.getElementById("console");
            const prompt = input.value.trim();

            if (!prompt) return;

            consoleBox.innerText += `\n\nUser: ${prompt}`;
            input.value = "";
            consoleBox.scrollTop = consoleBox.scrollHeight;

            try {
                const response = await fetch("/api/query", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();
                if (data.error) {
                    consoleBox.innerText += `\n\nNova-AI Core: ${data.error}`;
                    speakText("Telemetry alert. System encountered an issue.");
                } else {
                    consoleBox.innerText += `\n\nNova-AI Core: ${data.response}`;
                    // Trigger live voice execution
                    speakText(data.response);
                }
            } catch (err) {
                consoleBox.innerText += `\n\nNova-AI Core: Network connection fault. Unable to process request.`;
            }
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }
    </script>
