<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova-AI Powerhouse</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 10px;
        }
        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #ffffff;
            letter-spacing: 2px;
        }
        .header p {
            margin: 5px 0 0 0;
            font-size: 0.8rem;
            color: #9ca3af;
        }
        .badge {
            display: inline-block;
            background: #064e3b;
            color: #34d399;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #1f2937;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }
        .stat-card .label {
            font-size: 0.65rem;
            color: #9ca3af;
            text-transform: uppercase;
        }
        .stat-card .value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
        }
        .console-box {
            background: #030712;
            border: 1px solid #1f2937;
            border-radius: 4px;
            padding: 15px;
            height: 350px;
            overflow-y: auto;
            margin-bottom: 15px;
            font-size: 0.85rem;
            line-height: 1.4;
            white-space: pre-wrap;
        }
        .console-line {
            margin-bottom: 10px;
        }
        .system-msg { color: #34d399; }
        .user-msg { color: #60a5fa; }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            background: #030712;
            border: 1px solid #374151;
            color: #ffffff;
            padding: 10px;
            border-radius: 4px;
            font-family: inherit;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #00ffcc;
        }
        button {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }
        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="badge">AI Predictive Core Active</span>
        <h1>Nova-AI Powerhouse</h1>
        <p>SUPER INTELLIGENCE CORE MUNICIPAL ALLOCATION ENGINE</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="label">Housing Available</div>
            <div class="value">1,248</div>
        </div>
        <div class="stat-card">
            <div class="label">Taxpayer Savings</div>
            <div class="value">$350M+</div>
        </div>
        <div class="stat-card">
            <div class="label">Efficiency Rate</div>
            <div class="value">99.4%</div>
        </div>
    </div>

    <div class="console-box" id="console">
        <div class="console-line system-msg">Nova-AI Core: Intelligence system active. Select a jurisdiction or ask any question regarding municipal telemetry.</div>
    </div>

    <div class="input-group">
        <input type="text" id="promptInput" placeholder="Enter query or directive..." onkeydown="if(event.key==='Enter') sendQuery()">
        <button onclick="sendQuery()">Execute</button>
    </div>
</div>

<script>
    async function sendQuery() {
        const input = document.getElementById('promptInput');
        const consoleBox = document.getElementById('console');
        const query = input.value.trim();

        if (!query) return;

        consoleBox.innerHTML += `<div class="console-line user-msg">User: ${query}</div>`;
        input.value = '';
        consoleBox.scrollTop = consoleBox.scrollHeight;

        try {
            const response = await fetch('/api/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: query })
            });

            const data = await response.json();
            consoleBox.innerHTML += `<div class="console-line system-msg">Nova-AI Core: ${data.response}</div>`;
        } catch (err) {
            consoleBox.innerHTML += `<div class="console-line system-msg" style="color:#f87171;">Nova-AI Core Error: Network connection failed.</div>`;
        }

        consoleBox.scrollTop = consoleBox.scrollHeight;
    }
</script>

</body>
</html>
