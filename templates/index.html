<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova-AI Powerhouse | Municipal Allocation Engine</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2e;
            --accent-color: #00d2ff;
            --green-glow: #00ff87;
            --text-color: #e2e8f0;
            --subtext-color: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .header-card {
            background: var(--card-bg);
            border: 1px solid #2a354d;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            margin-bottom: 24px;
        }

        h1 {
            color: var(--accent-color);
            margin: 0 0 8px 0;
            font-size: 1.8rem;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            color: var(--subtext-color);
            margin: 0 0 16px 0;
            font-size: 0.95rem;
        }

        .status-badge {
            display: inline-block;
            background: rgba(0, 255, 135, 0.15);
            color: var(--green-glow);
            border: 1px solid var(--green-glow);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #2a354d;
            border-radius: 10px;
            padding: 20px;
        }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            color: var(--subtext-color);
        }

        .card .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .action-card {
            background: var(--card-bg);
            border: 1px solid #2a354d;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--subtext-color);
            font-size: 0.9rem;
        }

        select, input {
            width: 100%;
            padding: 10px;
            background: #0b0f19;
            border: 1px solid #2a354d;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #00d2ff, #0072ff);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            opacity: 0.9;
        }

        .results {
            display: none;
            background: rgba(0, 210, 255, 0.05);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-card">
            <h1>Nova-AI Powerhouse</h1>
            <p class="subtitle">Super Intelligence Core Municipal Allocation Engine</p>
            <span class="status-badge">System Active & Operational</span>
        </div>

        <div class="grid">
            <div class="card">
                <h3>Housing Units Available</h3>
                <div class="value">1,248</div>
            </div>
            <div class="card">
                <h3>Taxpayer Savings</h3>
                <div class="value">$350M+</div>
            </div>
            <div class="card">
                <h3>System Efficiency</h3>
                <div class="value">99.4%</div>
            </div>
        </div>

        <div class="action-card">
            <h3>Municipal Predictive Allocation Query</h3>
            <div class="form-group">
                <label for="region">Select Jurisdiction / District</label>
                <select id="region">
                    <option value="nc-01">NC District 01 (Rocky Mount / Eastern NC)</option>
                    <option value="national">National Emergency Response Network</option>
                </select>
            </div>
            <div class="form-group">
                <label for="capacity">Target Capacity Transition</label>
                <input type="number" id="capacity" value="500" placeholder="Enter target units">
            </div>
            <button onclick="runAllocation()">Execute Predictive Match</button>

            <div id="results" class="results">
                <strong>Allocation Optimization Complete:</strong>
                <p id="result-text" style="margin: 5px 0 0 0; color: var(--subtext-color);"></p>
            </div>
        </div>
    </div>

    <script>
        function runAllocation() {
            const capacity = document.getElementById('capacity').value;
            const region = document.getElementById('region').options[document.getElementById('region').selectedIndex].text;
            const resultsDiv = document.getElementById('results');
            const resultText = document.getElementById('result-text');

            resultText.innerText = `Successfully mapped ${capacity} transition units for ${region}. Cost offset calculated at $${(capacity * 35000).toLocaleString()} annually.`;
            resultsDiv.style.display = 'block';
        }
    </script>

</body>
</html>
